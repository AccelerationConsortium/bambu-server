# Copy to printers.local.yaml and keep the local file out of git.
# Addresses, serial numbers, and access codes are resolved from .env so they
# cannot accidentally appear in this file or in the HTTP API.

poll_interval_seconds: 2.0
stale_after_seconds: 20.0
cors_origins:
  - http://localhost:8000

# Submission intake. `directory` holds uploaded artifacts and their metadata;
# a relative path is resolved against this file, not the working directory.
submissions:
  directory: var/submissions
  max_file_bytes: 209715200      # 200 MiB
  scan_max_bytes: 67108864       # 64 MiB; above this only the head and tail of
                                 # an artifact are read and plate fit is not
                                 # reported rather than guessed from a partial scan
  retain_terminal_days: null     # keep print records; set a number to sweep old ones
  cancel_deletes_artifact: false # cancelling keeps the artifact unless true

# Result bundles and the optional ELN ingest via the central dashboard only.
# Without an ingest URL and BAMBU_RESULTS_TOKEN (env) every job stays local_only.
results:
  gateway_id: bambu_gateway
  ingest_url: null               # e.g. https://<dashboard>/api/ingest/print-results;
                                 # BAMBU_RESULTS_URL overrides it
  poll_interval_s: 60            # filing-status poll after delivery
  retry_initial_s: 10            # backoff doubles up to retry_max_s
  retry_max_s: 1800
  request_timeout_s: 10

# Control plane: claims and the start/stop/snapshot verbs. Off unless enabled
# here. With it off the gateway is exactly the monitoring-only release.
dispatch:
  enabled: false
  require_verified_identity: true  # approver and starter must come through the edge
  safe_bed_c: 45                   # refuse to start above these: the last job
  safe_nozzle_c: 70                # has not cooled and the plate is suspect
  confirm_timeout_s: 180           # how long the printer has to report RUNNING
  # Agent mode (approved 2026-11-02, Bambu A1 only): who may flip a printer's
  # switch, which edge roles count as agents (as does an X-Agent-Id header),
  # and how fresh an agent_camera snapshot must be.
  agent_mode_admin_roles: [admin]
  agent_roles: [agent]
  agent_snapshot_max_age_s: 120
  bed_leveling: true
  flow_calibration: false
  vibration_calibration: false
  timelapse: false

# Agent workflow integrations are data-only. They cannot move a printer or robot.
agent_workflow:
  event_webhook_urls: []           # e.g. [https://dashboard/api/ingest/events]
  event_buffer_size: 1000
  pickup_safe_bed_c: 45            # bed temperature at which a finished plate counts as cooled
  cooldown_watch_timeout_s: 14400  # how long to watch for job.cooled after job.finished
  vision_enabled: false            # advisory snapshot comparison only
  empty_bed_reference_directory: null  # operator-captured <printer_id>.jpg files

# STL slicing with an installed Bambu Studio (CLI, headless). Off unless enabled.
# `work_dir` must be writable by the service (its home is read-only under systemd).
slicer:
  enabled: false
  executable: /home/you/.local/bin/bambu-studio
  profiles_dir: /home/you/.local/opt/bambu-studio/squashfs-root/resources/profiles/BBL
  work_dir: var/slicer
  timeout_s: 600
  placement_margin_mm: 10          # gap to the bed edges for placement=front_left
  # Defaults for a printer that does not name its own process or filaments.
  process_profile: "0.20mm Standard @BBL X1C"
  filament_profiles:               # material a submitter names -> filament preset
    PLA: "Bambu PLA Basic @BBL X1C"
  # Printer id -> its presets; a printer not listed refuses .stl. A bare string
  # is the machine preset alone, with the defaults above. A printer whose
  # motion differs from the defaults' (an A1 bed-slinger against X1C presets)
  # names its own `process` and `filaments`; its `filaments` replace the
  # defaults rather than adding to them. A bundled preset that lists
  # `compatible_printers` must list this machine, or slicing is refused.
  machine_profiles:
    bambu_x1c_01: "Bambu Lab X1 Carbon 0.4 nozzle"
    # bambu_a1_01:
    #   machine: "Bambu Lab A1 0.4 nozzle"
    #   process: "0.20mm Standard @BBL A1"
    #   filaments:
    #     PLA: "Bambu PLA Basic @BBL A1"
    #   end_bed_y_mm: 250            # park the bed forward when done (stock Y180)

printers:
  - id: bambu_x1c_01
    name: Bambu X1 Carbon 01
    model: X1 Carbon
    env_prefix: BAMBU_X1C_01
    # Operator-declared machine profile. This is what a remote submitter targets
    # and what their model is validated against, so every value should be a fact
    # about the machine. Omit a field and the checks that need it report
    # `not_applicable` -- they never fall back to a guessed limit.
    profile:
      enclosure: enclosed            # `enclosed` or `open`
      nozzle_type: hardened_steel    # fallback for printers whose live field is blank
      nozzle_diameter_mm: 0.4
      bed_size_mm: [256, 256]        # X, Y
      # The build plate installed. The printer cannot detect it, so this is
      # the only record; dispatch refuses while it is undeclared and refuses a
      # job sliced for another plate. One of: cool_plate, eng_plate,
      # hot_plate, textured_plate, supertack_plate.
      plate: textured_plate
      chamber_temperature_c: null    # null on a machine with no chamber control
      limits:                        # `[min, max]` or `{min_c: , max_c: }`
        nozzle_temperature_c: [0, 300]
        bed_temperature_c: [0, 110]
        chamber_temperature_c: null
      ams:
        filament_forbidden: []       # e.g. [ABS, ASA] on an open-frame machine

  - id: bambu_a1_01
    name: Bambu A1 01
    model: A1
    env_prefix: BAMBU_A1_01
    # Lets a verified admin switch agent mode on for this printer at runtime
    # (POST /printers/bambu_a1_01/agent-mode). The switch itself starts off.
    # Accepted on a Bambu A1 only; any other model fails config validation.
    agent_mode_eligible: true
    # Named bed positions for POST /control/position_bed (approved 2026-11-05,
    # A1 only): `inspect` where the camera sees the whole plate, `pickup` where
    # the arm takes parts off (keep equal to the slicer's end_bed_y_mm).
    # bed_positions:
    #   inspect_y_mm: 128
    #   pickup_y_mm: 250
    #   arm_clear:                  # optional standing arm-clear declaration
    #     declared_by: yang
    #     declared_on: 2026-11-05
    #     statement: "The arm is always clear of the A1's bed travel; it reaches over the plate only while its agent holds the A1's claim."
    profile:
      enclosure: open
      nozzle_diameter_mm: 0.4
      bed_size_mm: [256, 256]
      plate: textured_plate
      limits:
        nozzle_temperature_c: [0, 300]
        bed_temperature_c: [0, 100]
